<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CHAOS.IO — ساحة الأبطال</title>
  <style>
    :root { --gold: #ffd166; --ink: #f4eedc; --muted: #b6ab8f; --panel: rgba(28,22,14,0.92); --edge: #6b4a2b; }
    html, body { margin: 0; padding: 0; background: #1b140c; overflow: hidden; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--ink); }
    * { box-sizing: border-box; }
    .px { image-rendering: pixelated; image-rendering: crisp-edges; }
    [style*="background-image"] { image-rendering: pixelated; }
    #game { width: 100vw; height: 100vh; }

    /* ---------------- lobby ---------------- */
    #login { position: fixed; inset: 0; z-index: 20; overflow-y: auto; padding: 16px;
      background: radial-gradient(circle at 50% 0%, #3a5a2a 0%, #1f2e17 45%, #120d08 100%); }
    #login .card { max-width: 980px; margin: 0 auto; background: var(--panel); border: 3px solid var(--edge); border-radius: 12px;
      box-shadow: 0 0 0 3px #2a1c10, 0 20px 60px rgba(0,0,0,0.6); padding: 18px 20px 20px; }
    #login h1 { margin: 0; text-align: center; color: var(--gold); font-size: 30px; letter-spacing: 2px; text-shadow: 0 3px 0 #7a4a12; }
    #login .sub { text-align: center; color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
    .steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
    .steps .st { font-size: 12px; padding: 5px 12px; border-radius: 20px; background: #2c2217; color: var(--muted); border: 1px solid #4a3622; }
    .steps .st.on { background: #6b4a2b; color: #fff; border-color: var(--gold); }
    .row { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
    #nameInput { width: 240px; padding: 10px 12px; border-radius: 8px; border: 2px solid #5a4028; background: #120d08; color: var(--ink); font-size: 15px; text-align: center; }
    .grid { display: grid; gap: 10px; }
    .heroes { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .skills { grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); }
    .tile { background: #231a10; border: 2px solid #4a3622; border-radius: 10px; padding: 10px; cursor: pointer; text-align: center; transition: transform .12s, border-color .12s, background .12s; position: relative; }
    .tile:hover { transform: translateY(-3px); border-color: #8a6a3a; }
    .tile.sel { border-color: var(--gold); background: #3b2b17; box-shadow: 0 0 16px rgba(255,209,102,0.35); }
    .tile.sel::after { content: '✓'; position: absolute; top: 6px; left: 8px; color: var(--gold); font-weight: 900; }
    .tile .face { width: 76px; height: 76px; margin: 0 auto 6px; border: 2px solid #5a4028; border-radius: 8px; background: #120d08; }
    .tile .walker { width: 48px; height: 48px; margin: 0 auto 4px; background-repeat: no-repeat; background-size: 192px 336px; background-position: 0 0; }
    .tile.sel .walker, .tile:hover .walker { animation: walk .6s steps(4) infinite; }
    @keyframes walk { from { background-position-y: 0; } to { background-position-y: -192px; } }
    .tile .nm { font-weight: 700; font-size: 14px; }
    .tile .ps { font-size: 11px; color: var(--gold); margin-top: 3px; }
    .tile .ds { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.45; min-height: 32px; }
    .tile .ico { margin: 0 auto 6px; }
    .tile .tag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 10px; background: #120d08; margin-top: 4px; }
    .legend .tile { border-color: #6b5320; }
    .legend .tile.sel { border-color: #ffb800; background: #402d0c; box-shadow: 0 0 22px rgba(255,184,0,0.45); }
    .combos { margin-top: 12px; background: #1a130b; border: 1px dashed #5a4028; border-radius: 10px; padding: 10px 12px; font-size: 12px; }
    .combos b { color: var(--gold); }
    .combos .cb { display: inline-block; margin: 3px 8px 3px 0; padding: 3px 8px; border-radius: 6px; background: #2a1f13; }
    .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
    .btn { padding: 11px 22px; border-radius: 8px; border: none; cursor: pointer; font-weight: 800; font-size: 15px; }
    .btn.primary { background: linear-gradient(180deg,#ffd166,#e89b2a); color: #2a1a05; box-shadow: 0 3px 0 #8a5510; }
    .btn.ghost { background: #2c2217; color: var(--ink); border: 1px solid #5a4028; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .counter { text-align: center; color: var(--gold); font-size: 13px; margin-bottom: 8px; }
    #loginStatus { color: #ff8a8a; text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; }

    /* ---------------- HUD ---------------- */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
    #hud.active { display: block; }
    .panel { position: absolute; pointer-events: none; }
    .wood { background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; box-shadow: 0 0 0 2px #2a1c10; }
    #dmgFlash { inset: 0; background: radial-gradient(ellipse at center, rgba(255,40,40,0) 45%, rgba(200,20,20,0.5) 100%); opacity: 0; transition: opacity .25s; }

    #vitals { left: 12px; bottom: 12px; padding: 8px; display: flex; gap: 8px; align-items: center; }
    #vitals .face { width: 56px; height: 56px; border: 2px solid var(--edge); border-radius: 8px; background: #120d08; }
    #vitals .bars { width: 190px; }
    .bar { direction: ltr; height: 12px; background: #120d08; border-radius: 4px; overflow: hidden; margin-bottom: 4px; border: 1px solid #3a2a18; }
    #hpFill { height: 100%; width: 100%; background: linear-gradient(90deg,#e84a4a,#ff8b5e); transition: width .12s; }
    #shieldFill { height: 100%; width: 100%; background: linear-gradient(90deg,#4aa8e8,#8affd9); transition: width .12s; }
    #statsLine { font-size: 12px; color: var(--muted); }
    #selfStatus { font-size: 15px; min-height: 18px; }

    #topbar { top: 10px; left: 50%; transform: translateX(-50%); text-align: center; padding: 5px 16px; }
    #timer { font-size: 22px; font-weight: 800; color: var(--gold); }
    #remaining { font-size: 11px; color: var(--muted); }

    #hotbar { left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 7px; padding: 7px; align-items: flex-end; }
    .slot { width: 58px; height: 58px; border-radius: 9px; background: #120d08; border: 2px solid #5a4028; position: relative; overflow: hidden; pointer-events: auto; cursor: pointer; touch-action: none; display: flex; align-items: center; justify-content: center; }
    .slot.legend { width: 70px; height: 70px; border-color: #ffb800; box-shadow: 0 0 12px rgba(255,184,0,.4); }
    .slot .ico { pointer-events: none; }
    .slot .key { position: absolute; top: 1px; right: 4px; font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; z-index: 2; }
    .slot .cd { position: absolute; inset: 0; background: rgba(0,0,0,0.68); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; z-index: 3; }
    .slot .cdbar { position: absolute; left: 0; bottom: 0; height: 100%; background: rgba(0,0,0,0.55); z-index: 1; }

    #passives { right: 12px; bottom: 12px; padding: 6px 8px; max-width: 230px; }
    #passives .ttl { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
    #passives .p { font-size: 12px; display: inline-flex; gap: 3px; align-items: center; background: #231a10; border: 1px solid #4a3622; border-radius: 6px; padding: 2px 6px; margin: 2px; }

    #killfeed { right: 12px; top: 12px; width: 240px; }
    #killfeed .k { font-size: 12px; background: rgba(28,22,14,0.85); border-right: 3px solid var(--gold); border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; }
    #playersLeft { left: 12px; top: 12px; font-size: 13px; color: var(--gold); padding: 6px 10px; }
    #helpBtn { left: 12px; top: 50px; pointer-events: auto; cursor: pointer; font-size: 12px; padding: 5px 10px; }
    #helpPanel { left: 12px; top: 86px; width: 260px; padding: 10px; font-size: 12px; display: none; }
    #helpPanel.show { display: block; }
    #helpPanel .cb { margin-bottom: 5px; }
    #helpPanel b { color: var(--gold); }

    #bossBar { left: 50%; top: 66px; transform: translateX(-50%); width: 300px; text-align: center; display: none; padding: 5px 8px; }
    #bossBar.show { display: block; }
    #bossBar .fill { height: 100%; background: linear-gradient(90deg,#ff3d81,#ff8a4c); width: 100%; }
    #bossBar .lbl { font-size: 12px; color: #ff9fbf; margin-bottom: 3px; }
    #banner { left: 50%; top: 110px; transform: translateX(-50%); font-size: 17px; font-weight: 800; color: var(--gold); text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .3s; text-align: center; white-space: nowrap; }
    #banner.show { opacity: 1; }
    #toast { left: 50%; bottom: 100px; transform: translateX(-50%); padding: 8px 14px; font-size: 13px; opacity: 0; transition: opacity .25s; text-align: center; display: flex; gap: 8px; align-items: center; }
    #toast.show { opacity: 1; }
    .slot.mythic { width: 70px; height: 70px; border-color: #c46bff; box-shadow: 0 0 14px rgba(196,107,255,.6); animation: mythGlow 1.4s ease-in-out infinite; }
    @keyframes mythGlow { 50% { box-shadow: 0 0 24px rgba(196,107,255,.95); } }
    #bossBar .lbl { color: #ffd166 !important; font-weight: 700; }
    #bossBar .fill { background: linear-gradient(90deg,#ffb800,#ffe27a) !important; }

    /* time stop overlay + champion arrow */
    #timeStopFx { inset: 0; opacity: 0; transition: opacity .2s; background: radial-gradient(ellipse at center, rgba(60,70,110,0.05) 30%, rgba(40,50,90,0.55) 100%); box-shadow: inset 0 0 120px rgba(255,226,122,0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #timeStopFx.show { opacity: 1; }
    #timeStopFx .clock { font-size: 64px; opacity: .35; animation: tsPulse .6s ease-in-out infinite alternate; }
    #timeStopFx .lbl { margin-top: 6px; font-size: 18px; font-weight: 800; color: #ffe27a; text-shadow: 0 2px 6px #000; }
    @keyframes tsPulse { to { transform: scale(1.15); opacity: .6; } }
    #champArrow { transform: translate(-50%, -50%); display: none; width: 46px; height: 46px; align-items: center; justify-content: center; }
    #champArrow.show { display: flex; }
    #champArrow .ar { position: absolute; font-size: 34px; color: #ffd166; text-shadow: 0 0 8px #000, 0 0 12px #ffb800; }
    #champArrow .cr { position: absolute; font-size: 18px; animation: tsPulse .5s ease-in-out infinite alternate; }

    /* ---------------- touch controls ---------------- */
    #touchUI { position: absolute; inset: 0; pointer-events: none; }
    #joyZone { position: absolute; left: 0; bottom: 0; width: 50vw; height: 62vh; pointer-events: auto; touch-action: none; }
    #joyBase { position: absolute; left: 96px; top: calc(100% - 110px); width: 130px; height: 130px; transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(circle, rgba(0,0,0,0.15), rgba(0,0,0,0.35)); border: 3px solid rgba(255,209,102,0.45); opacity: .45; transition: opacity .15s; }
    #joyBase.active { opacity: 1; transition: none; }
    #joyKnob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffe7a8, #e89b2a); box-shadow: 0 3px 8px rgba(0,0,0,.5); }
    #actionPad { position: absolute; right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); width: 240px; height: 240px; pointer-events: none; }
    .tbtn { position: absolute; width: 60px; height: 60px; border-radius: 50%; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
      background: radial-gradient(circle at 40% 35%, #3a2a18, #120d08); border: 3px solid #8a6a3a; box-shadow: 0 3px 8px rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .tbtn .ico { pointer-events: none; }
    .tbtn .cd { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.62); color: #fff; font-weight: 800; font-size: 18px; border-radius: 50%; }
    .tbtn.cooling .cd { display: flex; }
    .tbtn.held { transform: scale(1.12); border-color: #fff; }
    .tbtn.basic { width: 84px; height: 84px; right: 18px; bottom: 18px; border-color: #d8d8d8; }
    .tbtn.n0 { right: 125px; bottom: 30px; }
    .tbtn.n1 { right: 112px; bottom: 77px; }
    .tbtn.n2 { right: 77px; bottom: 112px; }
    .tbtn.legend { width: 68px; height: 68px; right: 26px; bottom: 126px; border-color: #ffb800; box-shadow: 0 0 14px rgba(255,184,0,.55); }
    .tbtn.mythic { width: 64px; height: 64px; right: 146px; bottom: 146px; border-color: #c46bff; animation: mythGlow 1.4s ease-in-out infinite; }
    body.touch, body.touch #game { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    body.touch #hotbar { display: none; }
    body.touch #vitals { left: 8px; top: 8px; bottom: auto; padding: 5px; gap: 5px; }
    body.touch #vitals .face { width: 36px; height: 36px; }
    body.touch #vitals .bars { width: 96px; }
    body.touch .bar { height: 9px; margin-bottom: 3px; }
    body.touch #statsLine { font-size: 10px; } body.touch #selfStatus { font-size: 12px; min-height: 14px; }
    body.touch #playersLeft { top: 86px; left: 8px; font-size: 11px; padding: 4px 8px; }
    body.touch #helpBtn { top: 86px; left: auto; right: 8px; font-size: 11px; padding: 4px 8px; }
    body.touch #helpPanel { top: 118px; left: 8px; right: 8px; width: auto; max-height: 55vh; overflow-y: auto; pointer-events: auto; font-size: 11px; }
    body.touch #passives { left: 8px; right: auto; top: 116px; bottom: auto; padding: 2px 4px; max-width: 45vw; }
    body.touch #passives .p { font-size: 13px; padding: 1px 3px; margin: 1px; }
    body.touch #killfeed { top: 118px; right: 8px; width: 44vw; }
    body.touch #killfeed .k { font-size: 10px; padding: 2px 6px; }
    body.touch #topbar { top: 6px; padding: 3px 10px; } body.touch #timer { font-size: 17px; } body.touch #remaining { font-size: 10px; }
    body.touch #bossBar { top: 8px; left: auto; right: 8px; transform: none; width: 34vw; padding: 3px 6px; }
    body.touch #bossBar .lbl { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    body.touch #banner { top: 150px; font-size: 13px; white-space: normal; width: 92vw; }
    body.touch #toast { bottom: auto; top: 40%; font-size: 12px; max-width: 90vw; }
    body.touch #timeStopFx .clock { font-size: 44px; }

    #waiting, #roundEnd { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 15; pointer-events: none; }
    #waiting.show, #roundEnd.show { display: flex; }
    #waiting .box, #roundEnd .box { padding: 20px 28px; text-align: center; min-width: 280px; max-width: 92vw; }
    #roundEnd table { border-collapse: collapse; margin-top: 10px; width: 100%; }
    #roundEnd td, #roundEnd th { padding: 4px 8px; font-size: 13px; text-align: center; }
    #roundEnd th { color: var(--gold); }
    #roundEnd img { width: 24px; height: 24px; vertical-align: middle; }

    @media (max-width: 640px) {
      #vitals .bars { width: 120px; } #vitals .face { width: 42px; height: 42px; }
      #hotbar { bottom: 92px; gap: 5px; } .slot { width: 48px; height: 48px; } .slot.legend { width: 56px; height: 56px; }
      #passives { max-width: 140px; } #killfeed { width: 160px; font-size: 10px; }
      #toast { bottom: 160px; }
      .nav { position: sticky; bottom: -16px; background: var(--panel); padding: 10px 0; margin-bottom: -4px; z-index: 2; }
      #login { padding: 8px; } #login .card { padding: 12px 10px 14px; }
      .heroes { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); } .skills { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="login">
    <div class="card">
      <h1>⚔ CHAOS.IO</h1>
      <div class="sub">ساحة الأبطال — اختر بطلك وقدراتك، آخر ناجٍ يفوز</div>
      <div class="steps" id="steps"></div>
      <div id="stepBody"></div>
      <div class="nav">
        <button class="btn ghost" id="backBtn">رجوع</button>
        <button class="btn primary" id="nextBtn">التالي</button>
      </div>
      <div id="loginStatus"></div>
    </div>
  </div>
  <div id="game"></div>

  <div id="hud">
    <div class="panel" id="dmgFlash"></div>
    <div class="panel wood" id="playersLeft">اللاعبون: --</div>
    <div class="panel wood" id="helpBtn">📜 الكومبوهات</div>
    <div class="panel wood" id="helpPanel"></div>
    <div class="panel wood" id="topbar"><div id="timer">--:--</div><div id="remaining"></div></div>
    <div class="panel wood" id="bossBar"><div class="lbl" id="bossLbl">👑 البطل الأقوى</div><div class="bar"><div class="fill" id="bossFill"></div></div></div>
    <div class="panel" id="banner"></div>
    <div class="panel wood" id="toast"></div>
    <div class="panel wood" id="vitals">
      <div class="face px" id="selfFace"></div>
      <div class="bars">
        <div class="bar"><div id="hpFill"></div></div>
        <div class="bar"><div id="shieldFill"></div></div>
        <div id="selfStatus"></div>
        <div id="statsLine">القتلات: 0</div>
      </div>
    </div>
    <div class="panel wood" id="hotbar"></div>
    <div class="panel wood" id="passives"></div>
    <div class="panel" id="killfeed"></div>
  </div>

  <div id="waiting"><div class="box wood"><h2 style="color:var(--gold);margin:0 0 8px;">بانتظار اللاعبين...</h2><div id="waitingCountdown" style="font-size:30px;font-weight:800;">--</div></div></div>
  <div id="roundEnd"><div class="box wood">
    <h2 id="reTitle" style="color:var(--gold);margin:0;">انتهت الجولة</h2>
    <table id="reTable"></table>
    <div style="margin-top:12px;color:var(--muted);font-size:12px;">الجولة القادمة تبدأ تلقائيًا...</div>
  </div></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
